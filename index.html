<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sneaker Store | Coleção 2024</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="logo">SNEAKER<span>HEAD</span></div>
        <ul class="nav-links">
            <li><a href="#">Lançamentos</a></li>
            <li><a href="#">Masculino</a></li>
            <li><a href="#">Feminino</a></li>
            <li class="cart-icon">🛒 <span>0</span></li>
        </ul>
    </nav>

    <header class="hero-store">
        <div class="hero-text">
            <span class="edition">Edição Limitada</span>
            <h1>AIR MAX <br>PHANTOM</h1>
            <p>Conforto extremo com tecnologia de amortecimento responsivo.</p>
            <a href="#" class="btn-buy">Comprar Agora — R$ 899</a>
        </div>
        <div class="hero-img-container">
            <!-- Imagem de exemplo (substitua pela sua) -->
            <img src="https://unsplash.com" alt="Tênis Vermelho">
        </div>
    </header>

    <section class="products-grid">
        <div class="product-card">
            <div class="img-box"><img src="https://unsplash.com" alt="Tênis"></div>
            <h3>Nike Retro Pastel</h3>
            <p class="price">R$ 549,90</p>
            <button class="add-cart">Adicionar</button>
        </div>

        <div class="product-card">
            <div class="img-box"><img src="https://unsplash.com" alt="Tênis"></div>
            <h3>Nike Zoom Green</h3>
            <p class="price">R$ 629,00</p>
            <button class="add-cart">Adicionar</button>
        </div>

        <div class="product-card">
            <div class="img-box"><img src="https://unsplash.com" alt="Tênis"></div>
            <h3>Adidas Runner X</h3>
            <p class="price">R$ 489,00</p>
            <button class="add-cart">Adicionar</button>
        </div>
    </section>

</body>
</html>
